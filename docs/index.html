<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>akis-pi · Interactive Pi Coding Agent Architecture</title>
<style>
  :root {
    --bg: #f7f5f0;
    --bg-glow-1: rgba(201, 82, 45, 0.065);
    --bg-glow-2: rgba(56, 114, 85, 0.06);
    --surface: #ffffff;
    --surface-soft: #f2efe8;
    --surface-hover: #fcfbf8;
    --border: rgba(28, 25, 23, 0.09);
    --border-strong: rgba(28, 25, 23, 0.20);
    --ink: #1c1917;
    --ink-muted: #57534e;
    --ink-dim: #8c867e;
    --terra: #c9522d;
    --terra-soft: rgba(201, 82, 45, 0.10);
    --sage: #387255;
    --sage-soft: rgba(56, 114, 85, 0.10);
    --ochre: #b57614;
    --ochre-soft: rgba(181, 118, 20, 0.11);
    --slate: #3f6070;
    --slate-soft: rgba(63, 96, 112, 0.10);
    --danger: #c63b32;
    --danger-soft: rgba(198, 59, 50, 0.10);
    --wire: rgba(28, 25, 23, 0.14);
    --backdrop: rgba(28, 25, 23, 0.34);
    --shadow-sm: 0 2px 10px rgba(28, 25, 23, 0.045);
    --shadow-md: 0 14px 38px rgba(28, 25, 23, 0.08);
    --shadow-lg: 0 32px 84px rgba(28, 25, 23, 0.18);
  }

  [data-theme="dark"] {
    --bg: #151412;
    --bg-glow-1: rgba(226, 114, 78, 0.09);
    --bg-glow-2: rgba(103, 176, 136, 0.07);
    --surface: #1e1d1a;
    --surface-soft: #262420;
    --surface-hover: #2b2924;
    --border: rgba(245, 240, 230, 0.09);
    --border-strong: rgba(245, 240, 230, 0.20);
    --ink: #f3efe8;
    --ink-muted: #b5afa5;
    --ink-dim: #7f7970;
    --terra: #e2724e;
    --terra-soft: rgba(226, 114, 78, 0.15);
    --sage: #67b088;
    --sage-soft: rgba(103, 176, 136, 0.14);
    --ochre: #dfa145;
    --ochre-soft: rgba(223, 161, 69, 0.15);
    --slate: #7ea3b5;
    --slate-soft: rgba(126, 163, 181, 0.15);
    --danger: #e4665c;
    --danger-soft: rgba(228, 102, 92, 0.16);
    --wire: rgba(245, 240, 230, 0.16);
    --backdrop: rgba(0, 0, 0, 0.56);
    --shadow-sm: 0 4px 14px rgba(0, 0, 0, 0.28);
    --shadow-md: 0 16px 44px rgba(0, 0, 0, 0.44);
    --shadow-lg: 0 36px 90px rgba(0, 0, 0, 0.68);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Hiragino Sans GB", sans-serif;
    background: var(--bg);
    background-image:
      radial-gradient(640px circle at 14% 8%, var(--bg-glow-1), transparent 68%),
      radial-gradient(660px circle at 86% 24%, var(--bg-glow-2), transparent 68%);
    color: var(--ink);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .mono, code { font-family: "SF Mono", "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: none; }
  }
  @keyframes explodeZone {
    from { opacity: 0; transform: scale(0.86); }
    to { opacity: 1; transform: scale(1); }
  }
  @keyframes collapseZone {
    from { opacity: 1; transform: scale(1); }
    to { opacity: 0; transform: scale(0.88); }
  }
  @keyframes burstChild {
    from { opacity: 0; transform: translate(var(--bx, 0px), var(--by, 14px)) scale(0.84); }
    to { opacity: 1; transform: translate(0, 0) scale(1); }
  }

  .enter { animation: fadeUp 0.55s cubic-bezier(0.22, 1, 0.36, 1) both; }
  .d1 { animation-delay: 0.07s; }

  /* Nav */
  .nav {
    position: sticky; top: 0; z-index: 30;
    backdrop-filter: blur(18px);
    background: color-mix(in srgb, var(--bg) 84%, transparent);
    border-bottom: 1px solid var(--border);
  }
  .nav-inner {
    max-width: 1200px; margin: 0 auto; padding: 12px 24px;
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
  }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
  .brand-dot {
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--ink); color: var(--bg);
    display: grid; place-items: center; font-weight: 600; font-size: 15px;
  }
  .brand-name { font-size: 14.5px; font-weight: 650; }
  .brand-sub { font-size: 12px; color: var(--ink-dim); font-weight: 400; margin-left: 4px; }

  .nav-actions { display: flex; align-items: center; gap: 8px; }
  .pill-btn {
    border: 1px solid var(--border-strong); background: var(--surface); color: var(--ink);
    border-radius: 999px; padding: 6px 14px; font-size: 12.5px; font-weight: 500;
    cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 5px;
    transition: transform .15s, background .15s, box-shadow .15s;
  }
  .pill-btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-sm); background: var(--surface-hover); }
  .pill-btn.subtle { background: transparent; border-color: transparent; color: var(--ink-muted); }
  .pill-btn.subtle:hover { background: var(--surface-soft); color: var(--ink); box-shadow: none; transform: none; }

  .wrap {
    max-width: 1200px; width: 100%; margin: 0 auto; padding: 0 24px;
    flex: 1; display: flex; flex-direction: column;
  }
  .canvas-sec {
    flex: 1; display: flex; flex-direction: column;
  }

  /* Compact Hero */
  .hero {
    padding: 24px 0 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap;
  }
  .hero-copy { max-width: 680px; flex: 1 1 420px; }
  .hero h1 {
    font-size: clamp(22px, 2.3vw, 28px); font-weight: 700; letter-spacing: -0.025em; line-height: 1.24;
  }
  .hero-sub {
    margin-top: 6px; font-size: 13.5px; color: var(--ink-muted); line-height: 1.5;
  }

  .hero-pills {
    display: flex; gap: 16px; flex-shrink: 0;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; padding: 12px 18px; box-shadow: var(--shadow-sm);
  }
  .hp { display: flex; flex-direction: column; white-space: nowrap; }
  .hp b { font-size: 17px; letter-spacing: -0.02em; }
  .hp span { font-size: 11px; color: var(--ink-dim); }

  /* Story Switcher */
  .toolbar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .stories { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .story-btn {
    border: 1px solid var(--border); background: var(--surface); color: var(--ink-muted);
    border-radius: 999px; padding: 6px 13px; font-size: 12.5px; font-weight: 500;
    cursor: pointer; transition: all .18s;
  }
  .story-btn:hover { border-color: var(--border-strong); color: var(--ink); }
  .story-btn.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .story-btn.fault.active { background: var(--danger); border-color: var(--danger); color: #fff; }
  .stage-hint { font-size: 12px; color: var(--ink-dim); }

  /* Main Interactive Canvas */
  .canvas-card {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 28px;
    box-shadow: var(--shadow-md);
    padding: 26px;
    overflow: hidden;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .stage {
    position: relative;
    flex: 1;
    min-height: 468px;
    display: grid;
    grid-template-columns: 0.96fr 1.14fr 1.04fr 0.96fr;
    grid-template-rows: 1fr 1fr;
    gap: 26px 34px;
    align-items: center;
    padding: 18px 6px 10px;
  }

  .stage-svg {
    position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 0;
    transition: opacity .25s ease;
  }
  .stage.is-exploded .stage-svg { opacity: 0.14; }

  .curve {
    fill: none; stroke: var(--wire); stroke-width: 1.85; stroke-linecap: round;
    transition: stroke .3s, stroke-width .3s, opacity .3s;
  }
  .curve.dashed { stroke-dasharray: 6 6; }
  .curve.active { stroke: var(--terra); stroke-width: 2.5; }
  .curve.active-sage { stroke: var(--sage); stroke-width: 2.5; }
  .curve.active-danger { stroke: var(--danger); stroke-width: 2.2; stroke-dasharray: 5 6; }
  .curve.dim { opacity: 0.18; }
  .orb { fill: var(--terra); opacity: 0.88; }
  .orb.sage { fill: var(--sage); }

  /* Start-here gentle pulse */
  @keyframes softPing {
    0% { transform: scale(1); opacity: 0.75; }
    70%, 100% { transform: scale(2.2); opacity: 0; }
  }
  .start-dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--terra);
    position: relative; display: inline-block; flex-shrink: 0;
  }
  .start-dot::after {
    content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--terra);
    animation: softPing 2.4s cubic-bezier(0, 0, 0.2, 1) infinite;
  }

  /* Level 1: Minimal Domain Bubbles (Flowing Left-to-Right Journey 01 -> 05) */
  .d-node {
    position: relative; z-index: 2;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 22px;
    padding: 18px 19px;
    cursor: pointer; text-align: left; color: var(--ink);
    display: flex; flex-direction: column; gap: 6px;
    box-shadow: var(--shadow-sm);
    transition: transform .26s cubic-bezier(0.22, 1, 0.36, 1), opacity .26s ease, border-color .2s, box-shadow .22s;
  }
  .d-node:hover {
    transform: translateY(-3px);
    border-color: var(--dc);
    box-shadow: var(--shadow-md);
  }
  .d-node.dimmed { opacity: 0.30; transform: scale(0.97); }
  .stage.is-exploded .d-node {
    opacity: 0.20;
    transform: scale(0.94);
    filter: blur(0.4px);
  }
  .stage.is-exploded .d-node:hover {
    opacity: 0.78;
    transform: scale(0.98);
    filter: none;
  }
  .stage.is-exploded .d-node.is-source {
    opacity: 0;
    pointer-events: none;
    transform: scale(1.06);
  }

  /* Organic staggered left-to-right flow (no rigid crosshair) */
  .pos-s1 { grid-column: 1; grid-row: 1 / span 2; align-self: center; transform: translateY(-18px); }
  .pos-s1:hover { transform: translateY(-21px); }
  .pos-s2 {
    grid-column: 2; grid-row: 1 / span 2; align-self: center; transform: translateY(12px);
    padding: 23px 22px;
    border-radius: 26px;
    background: linear-gradient(155deg, color-mix(in srgb, var(--terra) 7%, var(--surface)), var(--surface));
    border-color: color-mix(in srgb, var(--terra) 38%, var(--border));
    box-shadow: 0 10px 30px color-mix(in srgb, var(--terra) 9%, transparent), var(--shadow-sm);
  }
  .pos-s2:hover { transform: translateY(9px); }
  .pos-s3 { grid-column: 3; grid-row: 1; align-self: end; transform: translateY(-6px); }
  .pos-s3:hover { transform: translateY(-9px); }
  .pos-s4 { grid-column: 3; grid-row: 2; align-self: start; transform: translateY(6px); }
  .pos-s4:hover { transform: translateY(3px); }
  .pos-s5 { grid-column: 4; grid-row: 1 / span 2; align-self: center; transform: translateY(16px); }
  .pos-s5:hover { transform: translateY(13px); }

  .dn-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .dn-step {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 650; color: var(--dc);
    background: color-mix(in srgb, var(--dc) 11%, transparent);
    padding: 2.5px 9px; border-radius: 999px;
  }
  .dn-expand-hint { font-size: 11px; color: var(--ink-dim); white-space: nowrap; }
  .dn-title { font-size: 16px; font-weight: 700; letter-spacing: -0.02em; }
  .pos-s2 .dn-title { font-size: 18px; }
  .dn-sub { font-size: 12.5px; color: var(--ink-muted); line-height: 1.5; }
  .flow-caption {
    font-size: 10.5px; fill: var(--ink-dim); font-weight: 500;
  }

  /* Level 2: Exploded Dashed Zone — always mounted at viewport level so it can NEVER be clipped */
  .exploded-layer {
    position: fixed; inset: 0; z-index: 55;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    pointer-events: none;
    background: transparent;
    transition: background .24s ease, backdrop-filter .24s ease;
  }
  .exploded-layer.open {
    pointer-events: auto;
    background: color-mix(in srgb, var(--backdrop) 62%, transparent);
    backdrop-filter: blur(5px);
  }

  .exploded-zone {
    width: min(880px, 100%);
    max-height: 88dvh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    background: color-mix(in srgb, var(--surface) 95%, var(--ec, var(--terra)));
    backdrop-filter: blur(14px);
    border: 2px dashed color-mix(in srgb, var(--ec, var(--terra)) 62%, transparent);
    border-radius: 28px;
    padding: 22px 24px 24px;
    box-shadow: 0 28px 80px rgba(28, 25, 23, 0.18), 0 0 0 8px color-mix(in srgb, var(--ec, var(--terra)) 6%, transparent);
    animation: explodeZone 0.32s cubic-bezier(0.22, 1, 0.36, 1) both;
    position: relative;
  }
  .exploded-zone.closing {
    animation: collapseZone 0.22s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    pointer-events: none;
  }
  .exploded-zone.closing .child-card {
    transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.18s ease;
    transform: translate(var(--bx, 0px), var(--by, 12px)) scale(0.88);
    opacity: 0;
  }
  .ez-head {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 14px;
    margin-bottom: 18px;
  }
  .ez-kicker {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11.5px; font-weight: 650; color: var(--ec);
    background: color-mix(in srgb, var(--ec) 12%, transparent);
    padding: 3px 10px; border-radius: 999px; margin-bottom: 6px;
  }
  .ez-title { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
  .ez-desc { font-size: 13px; color: var(--ink-muted); margin-top: 2px; }
  .ez-close {
    border: 1px solid var(--border-strong); background: var(--surface); color: var(--ink-muted);
    border-radius: 999px; padding: 6px 13px; font-size: 12.5px; font-weight: 550;
    cursor: pointer; flex-shrink: 0; transition: all .15s;
  }
  .ez-close:hover { color: var(--ink); border-color: var(--ink); }

  .ez-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 12px;
  }
  .ez-grid.cols-4 {
    grid-template-columns: repeat(2, 1fr);
  }
  @media (min-width: 1120px) {
    .ez-grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
    .exploded-zone.wide { width: min(980px, 100%); }
  }
  .child-card {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 20px;
    padding: 18px 18px 16px;
    cursor: pointer; text-align: left; color: var(--ink);
    display: flex; flex-direction: column; gap: 7px;
    box-shadow: var(--shadow-sm);
    animation: burstChild 0.42s cubic-bezier(0.22, 1, 0.36, 1) both;
    animation-delay: var(--delay, 0s);
    transition: transform .18s, border-color .18s, box-shadow .18s;
  }
  .child-card:hover {
    transform: translateY(-3px);
    border-color: var(--ec);
    box-shadow: var(--shadow-md);
  }
  .cc-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .cc-tag {
    font-size: 11px; font-weight: 600; color: var(--ec);
    background: color-mix(in srgb, var(--ec) 11%, transparent);
    padding: 2px 9px; border-radius: 999px;
  }
  .cc-name { font-size: 15.5px; font-weight: 700; letter-spacing: -0.015em; }
  .cc-desc { font-size: 12.8px; color: var(--ink-muted); flex: 1; }
  .cc-foot {
    margin-top: 4px; font-size: 12px; font-weight: 600; color: var(--ec);
    display: flex; align-items: center; justify-content: space-between;
  }

  /* Bottom Story Strip inside Canvas (only shown when a specific question is active) */
  .story-strip {
    display: none;
    margin-top: 14px; padding: 11px 16px;
    background: var(--surface-soft); border-radius: 14px;
    font-size: 13px; color: var(--ink-muted);
    animation: fadeUp 0.25s ease both;
  }
  .story-strip.visible { display: block; }
  .story-strip strong { color: var(--ink); font-weight: 650; }
  .story-strip.fault {
    background: var(--danger-soft); color: var(--ink);
    border: 1px solid color-mix(in srgb, var(--danger) 28%, transparent);
  }

  /* Level 3: Floating Detail Card Modal */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 60;
    background: var(--backdrop);
    backdrop-filter: blur(8px);
    opacity: 0; pointer-events: none; transition: opacity .22s ease;
  }
  .modal-backdrop.open { opacity: 1; pointer-events: auto; }

  .modal-card {
    position: fixed; top: 50%; left: 50%; z-index: 65;
    transform: translate(-50%, -47%) scale(0.94);
    width: min(620px, 92vw);
    max-height: 86vh;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 26px;
    box-shadow: var(--shadow-lg);
    display: flex; flex-direction: column; overflow: hidden;
    opacity: 0; pointer-events: none; visibility: hidden;
    transition: opacity 0.22s ease, transform 0.26s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.26s;
  }
  .modal-card.open {
    opacity: 1; pointer-events: auto; visibility: visible;
    transform: translate(-50%, -50%) scale(1);
  }
  .m-head {
    padding: 22px 26px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: flex-start; justify-content: space-between; gap: 14px;
  }
  .m-crumb { font-size: 12px; color: var(--mc, var(--terra)); font-weight: 600; margin-bottom: 4px; }
  .m-title { font-size: 21px; font-weight: 700; letter-spacing: -0.02em; }
  .m-close {
    width: 32px; height: 32px; border-radius: 50%;
    border: 1px solid var(--border); background: var(--surface-soft); color: var(--ink-muted);
    font-size: 18px; cursor: pointer; display: grid; place-items: center; flex-shrink: 0;
  }
  .m-close:hover { color: var(--ink); border-color: var(--border-strong); }

  .m-body {
    padding: 20px 26px 24px; overflow-y: auto;
    display: flex; flex-direction: column; gap: 16px;
  }
  .m-lead { font-size: 14.5px; color: var(--ink); line-height: 1.65; }

  .analogy {
    background: color-mix(in srgb, var(--mc, var(--terra)) 8%, var(--surface-soft));
    border: 1px solid color-mix(in srgb, var(--mc, var(--terra)) 22%, transparent);
    border-radius: 16px; padding: 13px 16px;
  }
  .analogy-lbl { font-size: 11.5px; font-weight: 700; color: var(--mc, var(--terra)); display: block; margin-bottom: 3px; }
  .analogy-txt { font-size: 13.5px; color: var(--ink); line-height: 1.6; }

  .m-sec h4 { font-size: 11.5px; font-weight: 650; color: var(--ink-dim); margin-bottom: 8px; }
  .m-list { list-style: none; display: flex; flex-direction: column; gap: 7px; }
  .m-list li { font-size: 13.5px; padding-left: 15px; position: relative; color: var(--ink-muted); line-height: 1.58; }
  .m-list li::before {
    content: ""; position: absolute; left: 0; top: 9px; width: 5px; height: 5px;
    border-radius: 50%; background: var(--mc, var(--terra));
  }

  .m-links { display: flex; flex-wrap: wrap; gap: 8px; }
  .repo-pill {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--surface-soft); border: 1px solid var(--border);
    border-radius: 999px; padding: 7px 13px; text-decoration: none; color: var(--ink);
    font-size: 12.8px; font-weight: 550; transition: all .15s;
  }
  .repo-pill:hover { transform: translateY(-1px); border-color: var(--mc, var(--terra)); background: var(--surface); }
  .repo-pill span.arr { color: var(--mc, var(--terra)); }

  details.m-paths { border-top: 1px dashed var(--border-strong); padding-top: 11px; }
  details.m-paths summary { font-size: 12px; color: var(--ink-dim); cursor: pointer; list-style: none; }
  details.m-paths summary:hover { color: var(--ink); }
  .p-wrap { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 8px; }
  .p-chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--surface-soft); border: 1px solid var(--border); border-radius: 8px;
    padding: 4px 9px; font-size: 11.5px; color: var(--ink-muted);
  }
  .p-chip button {
    border: none; background: var(--surface); color: var(--ink-muted);
    border-radius: 5px; padding: 1px 6px; font-size: 10.5px; cursor: pointer;
  }

  .m-foot {
    padding: 12px 22px; border-top: 1px solid var(--border);
    background: var(--surface-soft);
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .m-nav-btn {
    border: 1px solid var(--border-strong); background: var(--surface); color: var(--ink);
    border-radius: 999px; padding: 5px 13px; font-size: 12px; font-weight: 550; cursor: pointer;
  }
  .m-nav-btn:hover { background: var(--surface-hover); }

  /* Collapsible Directory */
  .dir-section { margin: 18px 0 22px; }

  document.documentElement.lang = c.htmlLang;
  document.title = c.pageTitle;
  document.getElementById("brandTitle").textContent = c.brandTitle;
  document.getElementById("brandSub").textContent = c.brandSub;
  document.getElementById("themeBtn").textContent = c.themeLabel;
  document.getElementById("langBtn").textContent = lang === "en" ? "中文" : "EN";
  document.getElementById("heroTitle").textContent = c.heroTitle;
  document.getElementById("heroSub").textContent = c.heroSub;
  document.getElementById("stageHint").textContent = c.stageHint;
  document.getElementById("heroPills").innerHTML = c.pills.map(p =>
    `<div class="hp"><b${p.color ? ` style="color:${p.color}"` : ""}>${esc(p.val)}</b><span>${esc(p.lbl)}</span></div>`
  ).join("");

  const bar = document.getElementById("storyBar");
  bar.innerHTML = Object.entries(c.stories).map(([id, st]) =>
    `<button class="story-btn${id === currentStory ? " active" : ""}${st.fault ? " fault" : ""}" data-story="${id}" type="button">${esc(st.label)}</button>`
  ).join("");
  bar.querySelectorAll(".story-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      if (collapseTimer) { clearTimeout(collapseTimer); collapseTimer = null; }
      currentStory = btn.dataset.story;
      explodedId = null;
      applyStoryStrip();
      bar.querySelectorAll(".story-btn").forEach(b => b.classList.toggle("active", b === btn));
      renderStage();
    });
  });
  applyStoryStrip();

  document.getElementById("dirTitle").textContent = c.ui.dirTitle;
  document.getElementById("dirSub").textContent = c.ui.dirSub;
  document.getElementById("dirSearch").placeholder = c.ui.dirPlaceholder;
  document.getElementById("footLeft").innerHTML = c.ui.footLeft;
  document.getElementById("footRight").textContent = c.ui.footRight;
  document.getElementById("mPrev").textContent = c.ui.prev;
  document.getElementById("mNext").textContent = c.ui.next;
}

function applyStoryStrip() {
  const st = cur().stories[currentStory];
  const strip = document.getElementById("storyStrip");
  const showStrip = currentStory !== "overview";
  strip.classList.toggle("visible", showStrip);
  strip.classList.toggle("fault", !!st.fault);
  if (showStrip) document.getElementById("storyText").innerHTML = st.text;
}

function renderStage() {
  const stage = document.getElementById("stage");
  stage.querySelectorAll(".d-node").forEach(el => el.remove());
  stage.classList.toggle("is-exploded", !!explodedId);

  const map = domainMap();
  const st = cur().stories[currentStory];
  const activeSet = st.active ? new Set(st.active) : null;

  STEP_ORDER.map(id => map[id]).forEach(d => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = `d-node ${d.pos}`;
    btn.dataset.id = d.id;
    btn.style.setProperty("--dc", d.color);
    if (activeSet && !activeSet.has(d.id)) btn.classList.add("dimmed");
    if (explodedId === d.id) btn.classList.add("is-source");

    btn.innerHTML = `
      <div class="dn-row">
        <span class="dn-step">${d.start ? '<span class="start-dot"></span>' : ''}${esc(d.tag)}</span>
        <span class="dn-expand-hint">${d.children.length} ${esc(cur().ui.blocks)}</span>
      </div>
      <div class="dn-title">${esc(d.title)}</div>
      <div class="dn-sub">${esc(d.sub)}</div>
    `;
    btn.addEventListener("click", e => {
      e.stopPropagation();
      explodeDomain(d.id);
    });
    stage.appendChild(btn);
  });

  renderExploded();
  updateBodyScrollLock();
  requestAnimationFrame(drawCurves);
}

function explodeDomain(id) {
  if (collapseTimer) { clearTimeout(collapseTimer); collapseTimer = null; }
  explodedId = id;
  renderStage();
}

function collapseDomain() {
  if (!explodedId) return;
  if (collapseTimer) { clearTimeout(collapseTimer); collapseTimer = null; }
  const layer = document.getElementById("explodedLayer");
  const zone = layer.querySelector(".exploded-zone");
  const stage = document.getElementById("stage");
  stage.classList.remove("is-exploded");
  stage.querySelectorAll(".d-node.is-source").forEach(el => el.classList.remove("is-source"));
  if (zone) {
    zone.classList.add("closing");
    layer.classList.remove("open");
    explodedId = null;
    updateBodyScrollLock();
    requestAnimationFrame(drawCurves);
    collapseTimer = setTimeout(() => {
      collapseTimer = null;
      if (!explodedId) layer.innerHTML = "";
    }, 230);
  } else {
    explodedId = null;
    renderStage();
  }
}

function renderExploded() {
  const layer = document.getElementById("explodedLayer");
  if (!explodedId) {
    layer.classList.remove("open");
    layer.innerHTML = "";
    return;
  }
  const map = domainMap();
  const d = map[explodedId];
  const u = cur().ui;
  layer.classList.add("open");

  const mid = (d.children.length - 1) / 2;
  const cardsHtml = d.children.map((c, idx) => {
    const bx = Math.round((mid - idx) * 26);
    const by = 18;
    return `
      <button class="child-card" data-cid="${c.id}" style="--bx:${bx}px;--by:${by}px;--delay:${(idx * 0.055).toFixed(3)}s" type="button">
        <div class="cc-top"><span class="cc-tag">${esc(c.tag)}</span></div>
        <div class="cc-name">${esc(c.name)}</div>
        <div class="cc-desc">${esc(c.short)}</div>
        <div class="cc-foot"><span>${esc(u.openCard)}</span><span>↗</span></div>
      </button>
    `;
  }).join("");

  const curIdx = STEP_ORDER.indexOf(d.id);
  const nextId = curIdx >= 0 && curIdx < STEP_ORDER.length - 1 ? STEP_ORDER[curIdx + 1] : null;
  const nextDomain = nextId ? map[nextId] : null;
  const isFour = d.children.length >= 4;

  layer.innerHTML = `
    <div class="exploded-zone ${isFour ? "wide" : ""}" style="--ec:${d.color}">
      <div class="ez-head">
        <div>
          <span class="ez-kicker">◎ ${esc(d.tag)} · ${esc(u.inside)}</span>
          <div class="ez-title">${esc(d.title)}</div>
          <div class="ez-desc">${esc(d.intro)}</div>
        </div>
        <div style="display:flex;gap:8px;flex-shrink:0">
          ${nextDomain ? `<button id="ezNext" class="ez-close" style="color:var(--ec);border-color:color-mix(in srgb,var(--ec) 40%,transparent)" type="button">${esc(u.nextStop)} ${nextDomain.step} →</button>` : ""}
          <button id="ezClose" class="ez-close" type="button">${esc(u.collapse)}</button>
        </div>
      </div>
      <div class="ez-grid ${isFour ? "cols-4" : ""}">${cardsHtml}</div>
    </div>
  `;

  if (nextId) {
    document.getElementById("ezNext").addEventListener("click", e => { e.stopPropagation(); explodeDomain(nextId); });
  }
  document.getElementById("ezClose").addEventListener("click", e => { e.stopPropagation(); collapseDomain(); });
  layer.querySelector(".exploded-zone").addEventListener("click", e => e.stopPropagation());
  layer.querySelectorAll(".child-card").forEach(card => {
    card.addEventListener("click", e => { e.stopPropagation(); openModal(d.id, card.dataset.cid); });
  });
}

function openModal(domainId, childId) {
  const d = domainMap()[domainId];
  if (!d) return;
  const u = cur().ui;
  const idx = Math.max(0, d.children.findIndex(x => x.id === childId));
  const c = d.children[idx];
  modalDomainId = domainId;
  modalChildId = c.id;

  const card = document.getElementById("modalCard");
  card.style.setProperty("--mc", d.color);
  document.getElementById("mCrumb").textContent = `${d.title} · ${c.tag}`;
  document.getElementById("mTitle").textContent = c.name;

  const linksHtml = c.links && c.links.length ? `
    <div class="m-sec">
      <h4>${esc(u.repos)}</h4>
      <div class="m-links">
        ${c.links.map(l => `<a class="repo-pill" href="${esc(l.url)}" target="_blank" rel="noopener"><span>${esc(l.name)}</span><span class="arr">↗</span></a>`).join("")}
      </div>
    </div>` : "";

  const pathsHtml = c.paths && c.paths.length ? `
    <details class="m-paths">
      <summary>${esc(u.paths)}</summary>
      <div class="p-wrap">
        ${c.paths.map(p => `<span class="p-chip mono"><code>${esc(p)}</code><button data-copy="${esc(p)}" type="button">${esc(u.copy)}</button></span>`).join("")}
      </div>
    </details>` : "";

  const body = document.getElementById("mBody");
  body.innerHTML = `
    <p class="m-lead">${esc(c.lead)}</p>
    <div class="analogy">
      <span class="analogy-lbl">${esc(u.analogy)}</span>
      <span class="analogy-txt">${esc(c.analogy)}</span>
    </div>
    <div class="m-sec">
      <h4>${esc(u.keyDesign)}</h4>
      <ul class="m-list">
        ${c.bullets.map(b => `<li>${esc(b)}</li>`).join("")}
      </ul>
    </div>
    ${linksHtml}
    ${pathsHtml}
  `;

  body.querySelectorAll("[data-copy]").forEach(btn => {
    btn.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(btn.dataset.copy);
        btn.textContent = u.copied;
        setTimeout(() => btn.textContent = u.copy, 1200);
      } catch { btn.textContent = u.failed; }
    });
  });

  document.getElementById("mIdx").textContent = `${idx + 1} / ${d.children.length}`;
  card.classList.add("open");
  card.setAttribute("aria-hidden", "false");
  document.getElementById("modalBackdrop").classList.add("open");
  updateBodyScrollLock();
}

function closeModal() {
  modalDomainId = null;
  modalChildId = null;
  const card = document.getElementById("modalCard");
  card.classList.remove("open");
  card.setAttribute("aria-hidden", "true");
  document.getElementById("modalBackdrop").classList.remove("open");
  updateBodyScrollLock();
}

function stepModal(delta) {
  if (!modalDomainId) return;
  const d = domainMap()[modalDomainId];
  const i = d.children.findIndex(x => x.id === modalChildId);
  const next = (i + delta + d.children.length) % d.children.length;
  openModal(modalDomainId, d.children[next].id);
}

let animCurves = [];
function drawCurves() {
  const stage = document.getElementById("stage");
  const svg = document.getElementById("stageSvg");
  const sr = stage.getBoundingClientRect();
  if (window.innerWidth <= 1040 || sr.width < 880) { svg.innerHTML = ""; animCurves = []; return; }

  const box = id => {
    const el = stage.querySelector(`.d-node[data-id="${id}"]`);
    if (!el) return null;
    const r = el.getBoundingClientRect();
    return {
      x: r.left - sr.left + r.width / 2, y: r.top - sr.top + r.height / 2,
      l: r.left - sr.left, r: r.right - sr.left, t: r.top - sr.top, b: r.bottom - sr.top
    };
  };
  const s1 = box("interface"), s2 = box("core"), s3 = box("orchestration"), s4 = box("memory"), s5 = box("infra");
  if (!s1 || !s2 || !s3 || !s4 || !s5) return;

  const st = cur().stories[currentStory];
  const activeSet = st.active ? new Set(st.active) : null;
  const mx12 = (s1.r + s2.l) / 2, mx23 = (s2.r + s3.l) / 2, mx35 = (s3.r + s5.l) / 2;

  const links = [
    { id: "s1-s2", a: "interface", b: "core", d: `M ${s1.r} ${s1.y} C ${mx12 + 8} ${s1.y}, ${mx12 - 8} ${s2.y}, ${s2.l - 4} ${s2.y}`, kind: "terra" },
    { id: "s2-s3", a: "core", b: "orchestration", d: `M ${s2.r} ${s2.y - 16} C ${mx23 + 12} ${s2.y - 16}, ${mx23 - 10} ${s3.y}, ${s3.l - 4} ${s3.y}`, kind: "terra" },
    { id: "s2-s4", a: "core", b: "memory", d: `M ${s2.r} ${s2.y + 16} C ${mx23 + 12} ${s2.y + 16}, ${mx23 - 10} ${s4.y}, ${s4.l - 4} ${s4.y}`, kind: "sage" },
    { id: "s3-s5", a: "orchestration", b: "infra", d: `M ${s3.r} ${s3.y} C ${mx35 + 10} ${s3.y}, ${mx35 - 10} ${s5.y - 14}, ${s5.l - 4} ${s5.y - 14}`, kind: "terra", dashed: st.fault },
    { id: "s4-s5", a: "memory", b: "infra", d: `M ${s4.r} ${s4.y} C ${mx35 + 10} ${s4.y}, ${mx35 - 10} ${s5.y + 14}, ${s5.l - 4} ${s5.y + 14}`, kind: "sage", dashed: true },
    { id: "s2-s5", a: "core", b: "infra", d: `M ${s2.x} ${s2.b} C ${s2.x} ${sr.height - 8}, ${s5.x} ${sr.height - 8}, ${s5.x} ${s5.b + 4}`, kind: st.fault ? "danger" : "terra", dashed: true, subtle: !st.fault }
  ];

  svg.setAttribute("viewBox", `0 0 ${sr.width} ${sr.height}`);
  const defs = `<defs>
    <marker id="arr-wire" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M 1 1.5 L 6.5 4 L 1 6.5" fill="none" stroke="var(--wire)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /></marker>
    <marker id="arr-terra" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M 1 1.5 L 6.5 4 L 1 6.5" fill="none" stroke="var(--terra)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></marker>
    <marker id="arr-sage" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M 1 1.5 L 6.5 4 L 1 6.5" fill="none" stroke="var(--sage)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></marker>
    <marker id="arr-danger" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M 1 1.5 L 6.5 4 L 1 6.5" fill="none" stroke="var(--danger)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></marker>
  </defs>`;

  svg.innerHTML = defs + links.map(l => {
    const hit = !activeSet || (activeSet.has(l.a) && activeSet.has(l.b));
    let cls = "curve", mk = "url(#arr-wire)";
    if (l.dashed) cls += " dashed";
    if (!hit) cls += " dim";
    else if (activeSet) {
      if (l.kind === "sage") { cls += " active-sage"; mk = "url(#arr-sage)"; }
      else if (l.kind === "danger") { cls += " active-danger"; mk = "url(#arr-danger)"; }
      else { cls += " active"; mk = "url(#arr-terra)"; }
    }
    const showOrb = pulsesOn && hit && !l.subtle && !explodedId;
    return `<path id="p-${l.id}" class="${cls}" d="${l.d}" marker-end="${mk}" />` +
           (showOrb ? `<circle id="o-${l.id}" class="orb ${l.kind === "sage" ? "sage" : ""}" r="3.4" cx="-20" cy="-20" />` : "");
  }).join("");

  animCurves = links.map((l, i) => {
    const path = document.getElementById(`p-${l.id}`);
    const orb = document.getElementById(`o-${l.id}`);
    if (!path || !orb) return null;
    return { path, orb, len: path.getTotalLength(), phase: (i * 0.22) % 1, period: 3.4 + (i % 3) * 0.45 };
  }).filter(Boolean);
}

let lastT = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  if (pulsesOn && !explodedId) {
    for (const it of animCurves) {
      it.phase = (it.phase + dt / it.period) % 1;
      const pt = it.path.getPointAtLength(it.phase * it.len);
      it.orb.setAttribute("cx", pt.x.toFixed(1));
      it.orb.setAttribute("cy", pt.y.toFixed(1));
    }
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function renderDir(q = "") {
  const u = cur().ui;
  const term = q.trim().toLowerCase();
  const list = cur().directory.filter(x => !term || (x.name + x.ver + x.desc + x.url).toLowerCase().includes(term));
  document.getElementById("dirGrid").innerHTML = list.map(x => `
    <div class="dir-card">
      <div class="dir-top"><span class="mono">${esc(x.name)}</span><span class="dir-ver">${esc(x.ver)}</span></div>
      <div class="dir-desc">${esc(x.desc)}</div>
      <div class="dir-foot">
        <button data-d="${x.domain}" data-c="${x.child}" type="button">${esc(u.openNote)}</button>
        ${x.url ? `<a href="${esc(x.url)}" target="_blank" rel="noopener">GitHub ↗</a>` : `<span style="color:var(--ink-dim)">${esc(u.localOnly)}</span>`}
      </div>
    </div>
  `).join("");

  document.querySelectorAll("#dirGrid button").forEach(btn => {
    btn.addEventListener("click", () => {
      explodeDomain(btn.dataset.d);
      openModal(btn.dataset.d, btn.dataset.c);
    });
  });
}

document.getElementById("stage").addEventListener("click", () => collapseDomain());
document.getElementById("explodedLayer").addEventListener("click", () => collapseDomain());

document.getElementById("themeBtn").addEventListener("click", () => {
  const curTheme = document.documentElement.getAttribute("data-theme");
  document.documentElement.setAttribute("data-theme", curTheme === "light" ? "dark" : "light");
});

document.getElementById("langBtn").addEventListener("click", () => {
  lang = lang === "en" ? "zh" : "en";
  applyChrome();
  renderStage();
  renderDir(document.getElementById("dirSearch").value);
  if (modalDomainId && modalChildId) openModal(modalDomainId, modalChildId);
});

document.getElementById("mClose").addEventListener("click", closeModal);
document.getElementById("modalBackdrop").addEventListener("click", closeModal);
document.getElementById("mPrev").addEventListener("click", () => stepModal(-1));
document.getElementById("mNext").addEventListener("click", () => stepModal(1));

const dirSec = document.getElementById("dirSection");
const dirToggle = document.getElementById("dirToggle");
dirToggle.addEventListener("click", () => {
  const open = dirSec.classList.toggle("open");
  dirToggle.setAttribute("aria-expanded", String(open));
});
document.getElementById("dirSearch").addEventListener("input", e => renderDir(e.target.value));

document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    if (modalDomainId) closeModal();
    else if (explodedId) collapseDomain();
  } else if (modalDomainId && e.key === "ArrowRight") stepModal(1);
  else if (modalDomainId && e.key === "ArrowLeft") stepModal(-1);
});

window.addEventListener("resize", () => { updateBodyScrollLock(); drawCurves(); });
if (typeof ResizeObserver !== "undefined") {
  new ResizeObserver(() => requestAnimationFrame(drawCurves)).observe(document.getElementById("stage"));
}

const urlParam = new URLSearchParams(location.search).get("explode");
if (urlParam && domainMap()[urlParam]) explodedId = urlParam;

applyChrome();
renderStage();
renderDir();
</script>
</body>
</html>
